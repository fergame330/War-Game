<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172636">
  <title>Guerra Mundial — Jogo de Estratégia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Tela inicial -->
  <section id="start-screen" class="screen active">
    <div class="start-box">
      <h1>Guerra Mundial</h1>
      <p class="subtitle">Conquiste territórios, domine continentes e conquiste o mundo.</p>
      <button id="btn-start" class="btn btn-big">Começar jogo</button>
    </div>
  </section>

  <!-- Escolha do número de jogadores -->
  <section id="setup-screen" class="screen">
    <div class="start-box">
      <h2>Quantos jogadores?</h2>
      <div id="player-count" class="count-grid"></div>
      <div class="row">
        <button id="btn-back" class="btn btn-ghost">Voltar</button>
        <button id="btn-play" class="btn btn-big" disabled>Iniciar partida</button>
      </div>
    </div>
  </section>

  <!-- Jogo -->
  <section id="game-screen" class="screen">
    <header id="topbar">
      <div class="brand">Guerra Mundial</div>
      <div id="round-info"></div>
      <div id="current-chip"></div>
      <div class="spacer"></div>
      <button id="btn-names" class="btn btn-small btn-ghost" title="Mostrar/ocultar nomes dos territórios">Nomes</button>
      <button id="btn-cards" class="btn btn-small btn-ghost">Cartas</button>
      <button id="btn-help" class="btn btn-small btn-ghost">Regras</button>
    </header>
    <main id="game-main">
      <div id="map-wrap">
        <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="zoom-controls">
          <button id="zoom-in" title="Aproximar">+</button>
          <button id="zoom-out" title="Afastar">−</button>
          <button id="zoom-reset" title="Mapa inteiro">⤢</button>
        </div>
        <div id="tooltip" hidden></div>
      </div>
      <aside id="sidebar">
        <nav id="sheet-tabs">
          <button data-tab="turn">Turno</button>
          <button data-tab="players">Jogadores</button>
          <button data-tab="continents">Continentes</button>
          <button data-tab="log">Histórico</button>
        </nav>
        <section id="turn-panel" class="panel" data-tab="turn"></section>
        <section class="panel" data-tab="players">
          <h3>Jogadores</h3>
          <div id="players-panel"></div>
        </section>
        <section class="panel" data-tab="continents">
          <h3>Continentes</h3>
          <div id="continents-panel"></div>
        </section>
        <section class="panel" data-tab="log">
          <h3>Histórico</h3>
          <div id="log-panel"></div>
        </section>
      </aside>
    </main>
  </section>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/data.js"></script>
  <script src="js/mapdata.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ai-prompt.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
